[workspace]
members = ["crates/*"]
exclude = ["vendor/fuser"]
resolver = "2"

[workspace.package]
version = "0.2.70"
edition = "2021"
license = "MIT"
repository = "https://git.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/hashtree"
homepage = "https://git.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/hashtree"
authors = ["Martti Malmi"]

[workspace.dependencies]
# Core
sha2 = "0.10"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
async-trait = "0.1"
thiserror = "1.0"
semver = "1"

# P2P/discovery support
nostr-sdk = { version = "0.44", default-features = false, features = ["nip44", "nip59"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
futures = "0.3"
uuid = { version = "1.0", features = ["v4"] }

# Internal (path for local dev, version for publishing)
hashtree-core = { version = "0.2.70", path = "crates/hashtree-core" }
hashtree-index = { version = "0.2.70", path = "crates/hashtree-index" }
hashtree-collection = { version = "0.2.70", path = "crates/hashtree-collection" }
hashtree-lmdb = { version = "0.2.70", path = "crates/hashtree-lmdb" }
hashtree-s3 = { version = "0.2.70", path = "crates/hashtree-s3" }
hashtree-blossom = { version = "0.2.70", path = "crates/hashtree-blossom" }
hashtree-sim = { version = "0.2.70", path = "crates/hashtree-sim" }
hashtree-resolver = { version = "0.2.70", path = "crates/hashtree-resolver" }
hashtree-config = { version = "0.2.70", path = "crates/hashtree-config" }
hashtree-fs = { version = "0.2.70", path = "crates/hashtree-fs" }
hashtree-nostr = { version = "0.2.70", path = "crates/hashtree-nostr" }
hashtree-network = { version = "0.2.70", path = "crates/hashtree-network" }
hashtree-fips-transport = { version = "0.2.70", path = "crates/hashtree-fips-transport" }
hashtree-updater = { version = "0.2.70", path = "crates/hashtree-updater" }
cashu-service = { version = "0.2.56", path = "../../cashu-service/crates/cashu-service", default-features = false }

# AWS S3
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }

# Storage
heed = "0.20"
tempfile = "3"

# HTTP/Web
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Nostr
nostr = { version = "0.44", features = ["nip44"] }

# Utilities
anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
bytes = "1.0"
toml = "0.8"
lru = "0.12"
nostr-social-graph = "0.1.1"
nostr-social-graph-heed = "0.1.1"

[patch.crates-io]
fuser = { path = "vendor/fuser" }
