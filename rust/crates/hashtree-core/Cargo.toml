[package]
name = "hashtree-core"
version = "0.2.91"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Simple content-addressed merkle tree with KV storage"
keywords = ["merkle", "content-addressed", "hash", "tree", "storage"]

[dependencies]
sha2 = "0.11"
rmp-serde.workspace = true
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
hex.workspace = true
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
bech32 = "0.11"

# Encryption
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.13"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
criterion = "0.5"
rand = "0.8"
proptest = "1"

[[bench]]
name = "builder"
harness = false
