[package]
name = "hashtree-cli"
version = "0.2.136"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Hashtree daemon and CLI with content-addressed storage and adaptive blob routing"
default-run = "htree"

[[bin]]
name = "htree"
path = "src/main.rs"

[[bin]]
name = "git-remote-htree"
path = "src/git_remote.rs"
required-features = ["git-remote-wrapper"]

[dependencies]
# Git remote helper
git-remote-htree = { version = "0.2.82", path = "../git-remote-htree" }

# Core hashtree crates
hashtree-core.workspace = true
hashtree-fs.workspace = true
hashtree-fuse = { version = "0.2.82", path = "../fuse", optional = true, features = ["fuse"] }
hashtree-lmdb = { workspace = true, optional = true }
hashtree-blossom.workspace = true
hashtree-config.workspace = true
hashtree-nostr.workspace = true
hashtree-nostr-pubsub.workspace = true
hashtree-fips-transport.workspace = true
hashtree-network.workspace = true
hashtree-resolver = { workspace = true, features = ["nostr"] }
hashtree-updater.workspace = true
hashtree-index.workspace = true
cashu-service = { workspace = true, default-features = false }

# AWS S3 (optional)
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }

# Storage (heed needed for metadata databases)
heed.workspace = true
tempfile.workspace = true

# HTTP/Web
axum.workspace = true
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tower.workspace = true
tower-http.workspace = true

# Nostr
nostr.workspace = true
nostr-sdk.workspace = true
nostr-pubsub.workspace = true
nostr-pubsub-fips.workspace = true
nostr-pubsub-relay.workspace = true
nostr-social-graph.workspace = true
nostr-social-graph-heed.workspace = true

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
rmp-serde = "1.3"

# Async traits
async-trait.workspace = true

# Utilities
anyhow.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.22"
rand = "0.8"
socket2 = "0.5"
secp256k1 = { version = "0.29", features = ["global-context"] }
lru.workspace = true
libc = "0.2"
page_size = "0.6"
fuser = { version = "0.14", optional = true }
uuid.workspace = true

# CLI
clap.workspace = true
dirs = "5"
toml.workspace = true
ignore = "0.4"

# HTTP client for Blossom
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# TLS crypto provider
rustls = { version = "0.23", features = ["ring"] }

[features]
default = ["lmdb"]
cashu = ["cashu-service/wallet"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
lmdb = ["dep:hashtree-lmdb"]
fuse = ["dep:hashtree-fuse", "dep:fuser"]
fips-webrtc = ["hashtree-fips-transport/webrtc-endpoint"]
git-remote-wrapper = []
experimental-decentralized-pubsub = []

[dev-dependencies]
tempfile.workspace = true
walkdir = "2"
nostr.workspace = true
serde_json.workspace = true
http-body-util = "0.1"
