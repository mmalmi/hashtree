[package]
name = "hashtree-fips-transport"
version = "0.4.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Verified Hashtree blob routes over authenticated TCP/FIPS streams"
keywords = ["hashtree", "fips", "p2p", "merkle"]

[features]
default = []
interop-fixture = ["dep:hex", "dep:serde", "dep:serde_json"]
webrtc-endpoint = ["fips-core/webrtc-transport"]
webrtc = ["webrtc-endpoint"]

[dependencies]
async-trait.workspace = true
fips-core = "0.4.5"
fips-tcp = "0.2.0"
fips-tcp-endpoint = "0.2.0"
hashtree-core.workspace = true
hex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
hex.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }

[[bin]]
name = "hashtree-fips-stdio-fixture"
path = "src/bin/stdio_fixture.rs"
required-features = ["interop-fixture"]
