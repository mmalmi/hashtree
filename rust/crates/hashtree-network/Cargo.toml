[package]
name = "hashtree-network"
version = "0.2.85"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Transport-neutral mesh routing, signaling, peer links, and simulation core for hashtree"
keywords = ["merkle", "mesh", "p2p", "nostr", "hashtree"]

[dependencies]
anyhow.workspace = true
cashu-service = { workspace = true, default-features = false }
hashtree-core.workspace = true
hashtree-blossom.workspace = true
nostr-sdk.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
hex.workspace = true
bytes = "1.0"
rand = "0.8"
rmp-serde = "1.3"
serde_bytes = "0.11.19"
lazy_static = "1.4"
tracing = "0.1"
socket2 = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
hashtree-sim = { path = "../hashtree-sim" }
rustls = { version = "0.23", features = ["ring"] }
tempfile.workspace = true
