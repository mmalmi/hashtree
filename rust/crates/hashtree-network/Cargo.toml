[package]
name = "hashtree-network"
version = "0.2.85"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Adaptive read routing across opaque Hashtree blob sources"
keywords = ["merkle", "routing", "storage", "hashtree"]

[dependencies]
hashtree-core.workspace = true
tokio = { workspace = true, features = ["macros"] }
futures.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
