[package]
name = "hashtree-paid-retrieval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pay-to-retrieve blob route, provider and wallet interface for Hashtree"
keywords = ["cashu", "hashtree", "payments", "storage"]
readme = "README.md"

[features]
default = []
# Adapters for the existing cashu-service payment client.
cashu = ["dep:cashu-service"]
# The exchange as its own TCP/FIPS service, beside the free blob service of
# hashtree-fips-transport.
# The fake mint, wallet and receiver, for tests here and in applications.
test-support = ["tokio/sync"]
fips = ["dep:nvpn-fips-core", "dep:nvpn-fips-tcp", "dep:nvpn-fips-tcp-endpoint", "tokio/sync", "tokio/time"]

[dependencies]
hashtree-core.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "macros"] }
rand = "0.8"
cashu-service = { workspace = true, optional = true }
# The versions hashtree-fips-transport builds against.
nvpn-fips-core = { version = "0.4.95", optional = true }
nvpn-fips-tcp = { version = "0.2.5", optional = true }
nvpn-fips-tcp-endpoint = { version = "0.2.30", optional = true }

[dev-dependencies]
# The crate's own tests use its fake mint.
hashtree-paid-retrieval = { path = ".", features = ["test-support"] }
hashtree-network.workspace = true
tokio = { version = "1", features = ["full"] }
anyhow.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "e2e_fips"
required-features = ["fips"]
