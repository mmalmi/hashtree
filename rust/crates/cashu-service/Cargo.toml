[package]
name = "cashu-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Reusable Cashu helper and wallet primitives for paid connectivity services"

[features]
default = []
wallet = ["dep:cdk", "dep:cdk-sqlite", "dep:rand", "dep:url", "dep:hex", "dep:uuid"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }

cdk = { version = "0.15.1", default-features = false, features = ["wallet"], optional = true }
cdk-sqlite = { version = "0.15.1", default-features = false, features = ["wallet"], optional = true }
hex = { workspace = true, optional = true }
rand = { version = "0.8", optional = true }
url = { version = "2", optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["full"] }
