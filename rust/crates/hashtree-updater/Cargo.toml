[package]
name = "hashtree-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Hashtree-based app update discovery, artifact selection, and install helpers"

[features]
default = []
secure-nostr-blossom = [
  "dep:hashtree-blossom",
  "hashtree-blossom/store",
  "hashtree-resolver/nostr",
  "nostr-pubsub",
]
nostr-pubsub = [
  "dep:nostr-pubsub",
  "hashtree-resolver/nostr",
]

[dependencies]
hashtree-blossom = { workspace = true, optional = true }
hashtree-core.workspace = true
hashtree-resolver.workspace = true
nostr-pubsub = { workspace = true, optional = true }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# Used everywhere by the binary-archive install dispatcher; macOS app-bundle
# also needs both, Linux appimage just needs flate2.
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
async-trait.workspace = true
flate2 = "1.0"
hashtree-resolver = { workspace = true, features = ["nostr"] }
hashtree-sim = { path = "../hashtree-sim", features = ["nostr"] }
nostr-sdk.workspace = true
tar = "0.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
