[package]
name = "hashtree-updater"
version = "0.2.78"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Hashtree-based app update discovery, artifact selection, and install helpers"

[features]
default = []
secure-nostr-blossom = [
  "dep:hashtree-blossom",
  "hashtree-blossom/store",
  "hashtree-resolver/nostr",
]

[dependencies]
hashtree-blossom = { version = "0.2.72", path = "../hashtree-blossom", optional = true }
hashtree-core = { version = "0.2.72", path = "../hashtree-core" }
hashtree-resolver = { version = "0.2.78", path = "../hashtree-resolver" }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# Used everywhere by the binary-archive install dispatcher; macOS app-bundle
# also needs both, Linux appimage just needs flate2.
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
async-trait.workspace = true
flate2 = "1.0"
hashtree-resolver = { workspace = true, features = ["nostr"] }
hashtree-sim = { path = "../hashtree-sim", features = ["nostr"] }
tar = "0.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
