[package]
name = "hashtree-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Hashtree-based app update discovery, artifact selection, and install helpers"

[dependencies]
hashtree-core.workspace = true
hashtree-resolver.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1.0"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1.0"

[dev-dependencies]
async-trait.workspace = true
flate2 = "1.0"
hashtree-resolver = { workspace = true, features = ["nostr"] }
hashtree-sim = { path = "../hashtree-sim", features = ["nostr"] }
tar = "0.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
