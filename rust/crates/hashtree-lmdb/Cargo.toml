[package]
name = "hashtree-lmdb"
version = "0.2.90"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "LMDB-backed content-addressed blob storage for hashtree"

[dependencies]
hashtree-core.workspace = true
heed = { package = "hashtree-heed", version = "=0.20.5-hashtree.2", path = "../../vendor/heed", features = ["read-txn-no-tls"] }
async-trait.workspace = true
page_size = "0.6"
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
uuid.workspace = true
sha2.workspace = true
libc = "0.2"

# iOS rejects System V semaphore syscalls. Keep LMDB's normal cross-process
# locking using its supported POSIX backend; preserve macOS's existing format.
[target.'cfg(target_os = "ios")'.dependencies]
heed = { package = "hashtree-heed", version = "=0.20.5-hashtree.2", path = "../../vendor/heed", features = ["posix-sem"] }

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
