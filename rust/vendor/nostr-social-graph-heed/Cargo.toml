[package]
name = "hashtree-nostr-social-graph-heed"
version = "0.1.3-hashtree.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/mmalmi/nostr-social-graph"
homepage = "https://github.com/mmalmi/nostr-social-graph"
description = "Hashtree-compatible LMDB-backed Nostr social graph backend"
readme = "HASHTREE_FORK.md"
exclude = ["Cargo.lock"]

[lib]
name = "nostr_social_graph_heed"
path = "src/lib.rs"

[dependencies]
heed = { package = "hashtree-heed", version = "=0.20.5-hashtree.1", path = "../heed", features = ["read-txn-no-tls"] }
nostr-social-graph = "0.1.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
