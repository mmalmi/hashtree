[package]
name = "iris-nostr"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Local-first Nostr queries, signing and publishing for humans and agents"
default-run = "iris-nostr"
repository = "https://github.com/irislib/iris-nostr"
homepage = "https://github.com/irislib/iris-nostr"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "/README.md", "/LICENSE", "rust-toolchain.toml"]

[lib]
name = "iris_nostr"

[[bin]]
name = "iris-nostr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hashtree-core = "=0.3.0"
hashtree-config = "=0.2.83"
hashtree-fs = "=0.3.0"
hashtree-nostr = "=0.4.0"
hashtree-nostr-pubsub = "=0.4.0"
nostr = "=0.44.7"
nostr-pubsub = "=0.1.20"
nostr-pubsub-relay = "=0.1.15"
nostr-pubsub-social-graph = "=0.3.0"
nostr-social-graph = "=0.2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zeroize = "=1.9.1"

tempfile = "3"

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
