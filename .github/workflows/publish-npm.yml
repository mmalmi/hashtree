name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish new versions directly to npm (false previews archives only)
        type: boolean
        default: false
      prepared_worker_0425:
        description: Publish the exact previously qualified worker 0.4.25 archive
        type: boolean
        default: false
      packages:
        description: Comma-separated package names, or all (local dependencies included)
        type: string
        default: '@hashtree/core'

permissions:
  contents: read

concurrency:
  group: npm-publishing
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/master' && !inputs.prepared_worker_0425
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@12.0.2
      - name: Install FIPS interoperability dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Run the TypeScript release gate
        run: bash ../scripts/release-gate.sh --lane typescript
      - name: Build npm archives and verify their contents
        run: pnpm run publish:packages:dry-run > npm-pack.log 2>&1 || { tail -100 npm-pack.log; exit 1; }
      - name: Install browser for worker policy checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify worker behavior and default IIFE consumer bundles
        run: pnpm --filter @hashtree/worker test
      - name: Verify explicit browser transports and real WebRTC delivery
        working-directory: ts/packages/hashtree-fips-transport
        run: |
          pnpm exec vitest run tests/browserProvider.test.ts tests/workerProvider.integration.test.ts tests/workerProvider.listing.test.ts tests/workerProvider.serving.test.ts
          pnpm test:browser
      - name: Check examples and build API reference
        run: node scripts/check-doc-examples.mjs && pnpm docs:api
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ts/dist-npm/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-api-docs
          path: ts/docs/api/
          if-no-files-found: error

  publish:
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/master' && !inputs.prepared_worker_0425
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ts/dist-npm/
      - name: Publish verified archives using OIDC
        working-directory: ts
        env:
          # npm reports the OIDC exchange failure reason only at verbose level.
          NPM_CONFIG_LOGLEVEL: verbose
          NPM_PACKAGES: ${{ inputs.packages }}
        run: node scripts/publish-npm.mjs --prepared --packages="$NPM_PACKAGES"

  publish-qualified-worker:
    if: inputs.publish && inputs.prepared_worker_0425 && inputs.packages == '@hashtree/worker' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the exact qualified packing and publishing tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -gt 23068672
          curl --fail --location --connect-timeout 10 --max-time 180 --output "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz
          echo "48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75  $RUNNER_TEMP/node.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          curl --fail --location --connect-timeout 10 --max-time 180 --output "$RUNNER_TEMP/npm.tgz" https://registry.npmjs.org/npm/-/npm-12.0.2.tgz
          echo "5dbb86c71d07a1957f2e90734092dd6a58bdcd9ebc2d8d41ca1c6e6a21d364e1  $RUNNER_TEMP/npm.tgz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/qualified-npm"
          tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/qualified-npm"
          echo "$RUNNER_TEMP/node-v24.22.2-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Verify the exact artifact, carried isolated checks, and public source closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-prepared-worker.py --directory "$RUNNER_TEMP/worker-release" --download
      - name: Publish the verified archive using the established OIDC identity
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/worker-publish.npmrc
          NPM_CONFIG_CACHE: ${{ runner.temp }}/worker-npm-cache
          NPM_CONFIG_FETCH_TIMEOUT: '120000'
          NPM_CONFIG_FETCH_RETRIES: '1'
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.22.2
          touch "$NPM_CONFIG_USERCONFIG"
          node "$RUNNER_TEMP/qualified-npm/package/bin/npm-cli.js" publish "$RUNNER_TEMP/worker-release/hashtree-worker-0.4.25.tgz" --access public --registry https://registry.npmjs.org --provenance --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-0425-publication-evidence
          path: ${{ runner.temp }}/worker-release/verification.json
          if-no-files-found: warn
