name: Upload Size Source Publication Proof

on:
  push:
    branches: [codex/publish-upload-size-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Qualify public source with pinned ordinary Git tools
        run: python3 rust/scripts/qualify_source_update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-update-evidence
          path: ${{ runner.temp }}/source-update-evidence
          if-no-files-found: error
