name: Windows release input inventory
on:
  push:
    branches: [codex/cli-051-windows-inputs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record exact preinstalled Windows compiler and SDK
        shell: pwsh
        run: ./rust/scripts/inventory-windows.ps1
