name: Embedded Graph Wrapper Package

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Accepted immutable product source
        required: true
        default: '2c92fa01b9b70df055e811b762c132d1afec1eba'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PACKAGE_CARRIER: ${{ github.sha }}
    steps:
      - name: Require accepted source and hosted headroom
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PYGUARD'
          import os, shutil
          assert os.environ['SOURCE_COMMIT'] == '2c92fa01b9b70df055e811b762c132d1afec1eba'
          assert shutil.disk_usage('.').free >= 30 * 1024**3
          PYGUARD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.0
      - name: Prepare and qualify the exact embedded archive without compiling
        working-directory: rust
        run: |
          python3 - <<'PYDRIVER'
          import base64, hashlib, os
          from pathlib import Path
          data = base64.b64decode('')
          assert hashlib.sha256(data).hexdigest() == '2d11c24913f35c9f1e5d6e6814c936251906b6ed9e52db58fe4e8a48c3aef563'
          (Path(os.environ['RUNNER_TEMP']) / 'embedded-package-driver.py').write_bytes(data)
          PYDRIVER
          python3 "$RUNNER_TEMP/embedded-package-driver.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: embedded-package-evidence
          path: ${{ runner.temp }}/embedded-package-evidence
          if-no-files-found: error
