name: Local Service Provider Cohort

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full product commit to qualify
        required: false
        type: string
  push:
    branches: [codex/local-service-provider-cohort]

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
    steps:
      - name: Require an immutable source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: python3 -c 'import os, re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_COMMIT"])'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.0
      - name: Verify the actual daemon and transport consumer
        working-directory: rust
        run: python3 scripts/check_local_service_provider.py --logs "$RUNNER_TEMP/local-service-provider"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-service-provider-evidence
          path: ${{ runner.temp }}/local-service-provider
          if-no-files-found: error
