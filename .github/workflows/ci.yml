name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FIPS transport system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Setup Rust for TCP blob interoperability
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build hashtree and verify FIPS transport package
        run: pnpm run verify:fips-transport

      - name: Run ESLint
        run: pnpm lint

      - name: Run release wiring checks
        working-directory: .
        run: |
          bash scripts/test-release-script-defaults.sh
          bash scripts/tests/test_publish_release_wrapper.sh
          bash scripts/test-rust-binary-feature-wiring.sh
          bash scripts/test-ci-e2e-workflow.sh
          bash scripts/test-release-gate-wiring.sh
          node --test rust/tests/test_build_windows_vm_artifacts.mjs

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse3 \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libfuse3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Ensure FUSE device is available
        run: |
          sudo modprobe fuse || true
          ls -l /dev/fuse

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: |
          ulimit -Sn 8192
          cargo test --workspace --locked

      - name: Run FUSE mount smoke test in privileged Docker
        run: bash scripts/run_fuse_smoke_in_docker.sh

  rust-e2e-smoke-tests:
    name: Rust E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HTREE_E2E_RUST_TARGET_DIR: ${{ github.workspace }}/rust/target
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install E2E system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ env.HTREE_E2E_RUST_TARGET_DIR }}/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Build E2E binaries
        run: |
          cargo build --manifest-path ../rust/Cargo.toml -p hashtree-cli --bin htree
          cargo build --manifest-path ../rust/Cargo.toml --release -p hashtree-cli --bin htree
          cargo build --manifest-path ../rust/Cargo.toml --release -p git-remote-htree

      - name: Run mesh smoke test
        run: cargo test --manifest-path ../rust/Cargo.toml -p hashtree-network --test formal_mesh_props -- --nocapture
