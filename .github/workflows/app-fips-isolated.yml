name: Published Rust and repaired TypeScript file-transfer interoperability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set task-owned stage
        run: echo "MIXED_FILE_STAGE=$RUNNER_TEMP/mixed-file-interop" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned runtimes and fetch frozen inputs
        run: timeout --signal=TERM --kill-after=15s 1300s python3 fixtures/mixed-file-interop/controller.py prepare
      - name: Compile the published-crate fixture offline
        run: timeout --signal=TERM --kill-after=15s 1250s python3 fixtures/mixed-file-interop/controller.py build
      - name: Run four actual mixed file-transfer scenarios
        run: timeout --signal=TERM --kill-after=15s 680s python3 fixtures/mixed-file-interop/controller.py test
      - name: Retain all provenance and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mixed-file-interop-${{ github.sha }}
          path: ${{ runner.temp }}/mixed-file-interop/evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
