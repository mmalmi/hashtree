name: Chat mobile shell exact live policy responses
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fips:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FIPS_APPS: chat
    steps:
      - name: Set task-exclusive stage
        run: echo "FIPS_STAGE=$RUNNER_TEMP/chat-mobile-live-isolated" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned inputs before isolation
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=15s 1200s python3 fixtures/app-fips-isolated/controller.py prepare
      - name: Verify visible mobile shell after unsigned boundary controls
        run: timeout --signal=TERM --kill-after=15s 300s python3 fixtures/app-fips-isolated/controller.py test
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-fips-isolated-${{ github.sha }}
          path: ${{ runner.temp }}/chat-mobile-live-isolated/evidence
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
