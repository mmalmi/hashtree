name: Isolated graph consumer release gates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: [docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 68
    env:
      FIPS_APPS: ${{ matrix.app }}
    steps:
      - name: Set task-exclusive stage
        run: echo "FIPS_STAGE=$RUNNER_TEMP/app-runtime61-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned inputs before isolation
        run: timeout --signal=TERM --kill-after=15s 900s python3 fixtures/app-fips-isolated/controller.py prepare
      - name: Build and qualify after independent unsigned denial controls
        run: timeout --signal=TERM --kill-after=15s 3180s python3 fixtures/app-fips-isolated/controller.py test
      - name: Preserve logs and exact qualified distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-runtime61-${{ matrix.app }}-${{ github.sha }}
          path: ${{ runner.temp }}/app-runtime61-${{ matrix.app }}/evidence
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
