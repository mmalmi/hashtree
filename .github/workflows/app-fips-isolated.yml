name: Iris Git nostr-pubsub release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iris-git-pubsub-0542
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Set stage
        run: echo "FIPS_STAGE=$RUNNER_TEMP/iris-git-pubsub-0542" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare verified immutable inputs
        run: python3 fixtures/git-pubsub-0542/prepare.py
      - name: Run canonical Git release checks within existing lane limits
        run: |
          IMAGE=mcr.microsoft.com/playwright@sha256:83192064c7510f7ee73dd63dc5f22a5e01a92c81a2e6a9c715d9e3fe55471fd9
          docker pull "$IMAGE"
          test "$(df --output=avail -B1 "$FIPS_STAGE" | tail -1)" -gt 8589934592
          SOURCE_DATE_EPOCH=$(python3 -c 'import json;print(json.load(open("fixtures/git-pubsub-0542/manifest.json"))["epoch"])')
          timeout --signal=TERM --kill-after=15s 3600s docker run --rm --name iris-git-pubsub-0542 --cpus 2 --memory 4g --memory-swap 4g --pids-limit 512 --shm-size 512m --init --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --mount "type=bind,src=$FIPS_STAGE,dst=/stage" --workdir /stage/app -e HOME=/stage/home -e PATH=/stage/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright -e PW_WORKERS=2 -e PW_APP_PORT=49173 -e CI=true -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" -e HTREE_BIN=/stage/tools/native/hashtree/htree -e GIT_REMOTE_HTREE_BIN=/stage/tools/native/hashtree/git-remote-htree "$IMAGE" node /stage/qualify.mjs
      - name: Preserve exact artifact and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iris-git-pubsub-0542-${{ github.sha }}
          path: |
            ${{ runner.temp }}/iris-git-pubsub-0542/evidence
            ${{ runner.temp }}/iris-git-pubsub-0542/app/test-results
          if-no-files-found: error
          retention-days: 7
