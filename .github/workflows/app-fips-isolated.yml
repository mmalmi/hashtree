name: Exact-source Git manual-trace continuation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: [git]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      FIPS_APPS: ${{ matrix.app }}
    steps:
      - name: Set task-exclusive stage
        run: echo "FIPS_STAGE=$RUNNER_TEMP/app-graph404-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned inputs before isolation
        run: timeout --signal=TERM --kill-after=15s 900s python3 fixtures/app-fips-isolated/controller.py prepare
      - name: Fetch immutable prior dev-source browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$FIPS_STAGE/earlier"
          gh api repos/mmalmi/hashtree/actions/artifacts/13672738298/zip > "$FIPS_STAGE/earlier.zip"
          echo "d845a9ed80a88c096892e524eb8ef9973f49214685fb61e35924c41111f7d773  $FIPS_STAGE/earlier.zip" | sha256sum --check
          python3 -m zipfile -e "$FIPS_STAGE/earlier.zip" "$FIPS_STAGE/earlier"
      - name: Build and qualify after independent unsigned denial controls
        run: timeout --signal=TERM --kill-after=15s 3180s python3 fixtures/app-fips-isolated/controller.py test
      - name: Preserve logs and exact qualified distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-graph404-${{ matrix.app }}-${{ github.sha }}
          path: ${{ runner.temp }}/app-graph404-${{ matrix.app }}/evidence
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
