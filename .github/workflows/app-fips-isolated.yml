name: Fresh client runtime61 complete release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FIPS_APPS: client
    steps:
      - name: Set task-exclusive stage
        run: echo "FIPS_STAGE=$RUNNER_TEMP/client-graph404" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact Git history and frozen dependencies
        run: timeout --signal=TERM --kill-after=15s 900s python3 fixtures/client-graph404/controller.py prepare
      - name: Qualify complete original release plan after independent OS denial
        run: timeout --signal=TERM --kill-after=15s 4110s python3 fixtures/client-graph404/controller.py test
      - name: Preserve evidence and qualified distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-graph404-${{ github.sha }}
          path: ${{ runner.temp }}/client-graph404/evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
