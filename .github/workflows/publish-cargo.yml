name: Publish Cargo packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev libdbus-1-dev libfuse3-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - name: Publish the released workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: rust/scripts/publish.sh --version "$RELEASE_TAG"
      - name: Smoke test the default registry install
        run: |
          cargo install --registry crates-io --version "=${RELEASE_TAG#v}" --root "$RUNNER_TEMP/installed" hashtree-cli
          "$RUNNER_TEMP/installed/bin/htree" --version
          "$RUNNER_TEMP/installed/bin/git-remote-htree" --publisher-capabilities
