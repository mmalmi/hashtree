name: TCP Transport Cancellation

on:
  workflow_dispatch:
  push:
    branches: [codex/tcp-transport-cancellation]

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Node.js
        run: |
          curl --fail --location --output "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v24.11.0/node-v24.11.0-linux-x64.tar.xz
          echo "46da9a098973ab7ba4fca76945581ecb2eaf468de347173897044382f10e0a0a  $RUNNER_TEMP/node.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.11.0-linux-x64/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: ts/package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
      - name: Install interoperability dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Record source and toolchains
        run: |
          mkdir -p "$RUNNER_TEMP/tcp-cancellation"
          git rev-parse HEAD > "$RUNNER_TEMP/tcp-cancellation/source.txt"
          node --version > "$RUNNER_TEMP/tcp-cancellation/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/tcp-cancellation/toolchain.txt"
          rustc -Vv >> "$RUNNER_TEMP/tcp-cancellation/toolchain.txt"
          dpkg-query -W > "$RUNNER_TEMP/tcp-cancellation/system-packages.txt"
          df -Pk .
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -gt 20971520
      - run: pnpm install --frozen-lockfile
        working-directory: ts
      - name: Build core dependency
        run: pnpm --filter @hashtree/core build
        working-directory: ts
      - name: Prove shutdown regressions on the previous transport
        working-directory: ts/packages/hashtree-fips-transport
        run: |
          set -euo pipefail
          trap 'git restore --source="$GITHUB_SHA" -- src/tcpBlobTransport.ts' EXIT
          git show 897b9e36820e1fc0866c8fe2c6ec3b97096dc69d:ts/packages/hashtree-fips-transport/src/tcpBlobTransport.ts > src/tcpBlobTransport.ts
          if pnpm exec vitest run tests/tcpBlobCancellation.test.ts --reporter=json --outputFile="$RUNNER_TEMP/tcp-cancellation/baseline.json" > "$RUNNER_TEMP/tcp-cancellation/baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/tcp-cancellation/baseline.log"
            exit 1
          fi
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/tcp-cancellation/baseline.json")); assert.equal(r.numFailedTests,6); assert.equal(r.numPassedTests,0);'
      - name: Verify transport, authenticated serving and Rust interoperability
        working-directory: ts/packages/hashtree-fips-transport
        run: |
          pnpm test --maxWorkers=2 --no-file-parallelism --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/tcp-cancellation/candidate.json" > "$RUNNER_TEMP/tcp-cancellation/candidate.log" 2>&1 || { tail -100 "$RUNNER_TEMP/tcp-cancellation/candidate.log"; exit 1; }
          pnpm lint > "$RUNNER_TEMP/tcp-cancellation/lint.log" 2>&1 || { cat "$RUNNER_TEMP/tcp-cancellation/lint.log"; exit 1; }
          pnpm build > "$RUNNER_TEMP/tcp-cancellation/build.log" 2>&1 || { cat "$RUNNER_TEMP/tcp-cancellation/build.log"; exit 1; }
          pnpm pack --pack-destination "$RUNNER_TEMP/tcp-cancellation" > "$RUNNER_TEMP/tcp-cancellation/pack.log" 2>&1
          sha256sum "$RUNNER_TEMP/tcp-cancellation/hashtree-fips-transport-0.4.30.tgz" > "$RUNNER_TEMP/tcp-cancellation/package.sha256"
          git diff -- dist > "$RUNNER_TEMP/tcp-cancellation/generated-dist.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tcp-cancellation-evidence
          path: ${{ runner.temp }}/tcp-cancellation
          if-no-files-found: error
