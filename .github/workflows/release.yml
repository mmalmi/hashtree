name: Pinned native toolchain qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d868f22bb2b4112094572580ae63d132005f6674
      - name: Execute the reviewed native setup entry point
        shell: bash
        working-directory: rust
        run: python3 scripts/release_inputs.py native --target '${{ matrix.target }}'
      - name: Compile and execute a minimal target binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification
          rustc --version > qualification/rustc.txt
          cargo --version > qualification/cargo.txt
          rustc --print target-libdir --target '${{ matrix.target }}' > qualification/target.txt
          printf '%s\n' 'fn main() { println!("pinned-toolchain-smoke"); }' > qualification/smoke.rs
          binary="$RUNNER_TEMP/toolchain-smoke${{ runner.os == 'Windows' && '.exe' || '' }}"
          rustc --target '${{ matrix.target }}' qualification/smoke.rs -o "$binary"
          "$binary" > qualification/output.txt
          test "$(cat qualification/output.txt)" = pinned-toolchain-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-toolchain-${{ matrix.target }}
          path: qualification/*.txt
          if-no-files-found: warn
