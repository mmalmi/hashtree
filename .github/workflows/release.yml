name: Integrate verified public release recipe
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f19cb5d0cf78e61533cd086f29ba83d7f0193b27
          persist-credentials: false
      - name: Require exact source CI and fast-forward only the public master
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = await import('node:fs/promises');
            const { findReusableCiRun } = await import(`${process.env.GITHUB_WORKSPACE}/rust/scripts/release_ci_evidence.mjs`);
            const source = 'f19cb5d0cf78e61533cd086f29ba83d7f0193b27';
            const previous = '9426e71ad02efdb8d41d5701f297d9045c1a441a';
            const repository = 'mmalmi/hashtree';
            if (`${context.repo.owner}/${context.repo.repo}` !== repository) throw new Error('Wrong repository');
            const run = await findReusableCiRun({ github, repository, sha: source });
            if (!run || run.id !== 41890744446) throw new Error('Exact qualified source CI is not complete');
            const before = await github.rest.git.getRef({ ...context.repo, ref: 'heads/master' });
            if (before.data.object.sha !== previous) throw new Error('Public master changed; coordinate its owner');
            await github.rest.git.updateRef({ ...context.repo, ref: 'heads/master', sha: source, force: false });
            const after = await github.rest.git.getRef({ ...context.repo, ref: 'heads/master' });
            if (after.data.object.sha !== source) throw new Error('Public master readback differs');
            const receipt = { repository, previous, source, fast_forward: true, source_ci: run.id, actor: 'repository workflow token' };
            await fs.writeFile('integration-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
            core.notice('Integrated the exact verified public release recipe; push-triggered duplicate CI is suppressed by the repository workflow token.');
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-recipe-integration
          path: integration-receipt.json
