name: Windows release input drift qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Record native SDK assumptions
        shell: pwsh
        run: |
          New-Item -ItemType Directory inventory
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installations = & $vswhere -format json | ConvertFrom-Json
          $entries = foreach ($installation in $installations) {
            @{ version = $installation.installationVersion; toolsets = @(Get-ChildItem "$($installation.installationPath)/VC/Tools/MSVC" | Select-Object -ExpandProperty Name) }
          }
          @{ imageOS = $env:ImageOS; imageVersion = $env:ImageVersion; visualStudio = @($entries); sdk = @(Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/Lib" | Select-Object -ExpandProperty Name) } | ConvertTo-Json -Depth 5 | Set-Content inventory/windows-sdk.json
          Get-Content inventory/windows-sdk.json
      - name: Run exact native helper with the observed Windows profile
        shell: bash
        working-directory: rust
        run: |
          python3 scripts/release_inputs.py native --target x86_64-pc-windows-msvc
      - name: Compile and execute minimal target in the product build shell
        shell: pwsh
        run: |
          rustc --version | Set-Content inventory/rustc.txt
          cargo --version | Set-Content inventory/cargo.txt
          'fn main() { println!("pinned-toolchain-smoke"); }' | Set-Content inventory/smoke.rs
          Get-Command link.exe | Select-Object -ExpandProperty Source | Set-Content inventory/linker.txt
          rustc --target x86_64-pc-windows-msvc inventory/smoke.rs -o "$env:RUNNER_TEMP/toolchain-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
          & "$env:RUNNER_TEMP/toolchain-smoke.exe" | Set-Content inventory/output.txt
          if ($LASTEXITCODE -ne 0 -or (Get-Content inventory/output.txt) -ne "pinned-toolchain-smoke") { throw "Executable smoke failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prebuilt-inputs-windows-${{ matrix.sample }}
          path: |
            inventory/*.json
            inventory/*.txt
