name: Diagnose published installer fixture lookup
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            rust/scripts/reuse_qualified_fixture_input.py
            rust/scripts/diagnose_installer_fixture.py
      - name: Retrieve already qualified public input bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 rust/scripts/reuse_qualified_fixture_input.py
      - name: Diagnose existing address without a signing identity
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python3 rust/scripts/diagnose_installer_fixture.py
      - name: Retain redacted diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixture-readonly-diagnosis
          path: ${{ runner.temp }}/fixture-readonly-diagnosis.json
          if-no-files-found: error
          retention-days: 14
