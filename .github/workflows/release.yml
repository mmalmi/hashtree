name: Native Cargo version inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            sha256: 2d84a74e9558192a7de674aca6aa3ab7464bed2df97e0377156ddb7e09a0fd7a
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            sha256: 1180ac0cd30ee98af682528c10505f5cba118f122aec9b7ca18ae605b1db38a0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Execute the locked Cargo version probe
        shell: bash
        env:
          CARGO_TARGET: ${{ matrix.target }}
          CARGO_SHA256: ${{ matrix.sha256 }}
        run: |
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess, tarfile, urllib.request
          target = os.environ['CARGO_TARGET']
          name = f'cargo-1.97.1-{target}'
          url = f'https://static.rust-lang.org/dist/2026-07-16/{name}.tar.xz'
          data = urllib.request.urlopen(url, timeout=120).read()
          assert hashlib.sha256(data).hexdigest() == os.environ['CARGO_SHA256']
          archive = pathlib.Path(name + '.tar.xz')
          archive.write_bytes(data)
          with tarfile.open(archive) as package:
              package.extractall('probe', filter='data')
          binary = pathlib.Path('probe') / name / 'cargo/bin' / ('cargo.exe' if os.name == 'nt' else 'cargo')
          output = subprocess.check_output([str(binary.resolve()), '--version'], text=True).strip()
          receipt = {'target': target, 'url': url, 'sha256': os.environ['CARGO_SHA256'], 'version': output}
          pathlib.Path('cargo-version.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-version-${{ matrix.target }}
          path: cargo-version.json
