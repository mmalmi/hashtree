name: Prebuilt input inventory
on:
  workflow_dispatch:
  push:
    branches: [codex/prebuilt-input-inventory-031]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve and verify immutable package inputs
        env:
          BUILD_IMAGE: rust:1.97-alpine3.22@sha256:df4efa4e0cdfb5245fa06e3f431387b2bcc96782ce5681b7fb6b0297d745bc29
        run: |
          set -euo pipefail
          test "$(df -B1 --output=avail / | tail -1)" -gt 15000000000
          mkdir -p inventory/packages
          chmod 777 inventory inventory/packages
          docker pull --platform '${{ matrix.platform }}' "$BUILD_IMAGE"
          docker run --rm --platform '${{ matrix.platform }}' -v "$PWD/inventory:/out" "$BUILD_IMAGE" sh -ec '
            rustc --version > /out/rust-version.txt
            apk info -vv | sort > /out/base-packages.txt
            cp /lib/apk/db/installed /out/base-installed.txt
            apk update
            apk add build-base clang clang-dev lld musl-dev linux-headers pkgconf cmake perl git
            apk info -vv | sort > /out/final-packages.txt
            cp /lib/apk/db/installed /out/final-installed.txt
          '
          python3 - <<'PYCODE'
          import pathlib
          root = pathlib.Path('inventory')
          def installed(path):
              entries = {}
              for block in path.read_text().split('\n\n'):
                  fields = dict(line.split(':', 1) for line in block.splitlines() if ':' in line)
                  if 'P' in fields:
                      entries[fields['P']] = fields['V']
              return entries
          before = installed(root / 'base-installed.txt')
          after = installed(root / 'final-installed.txt')
          (root / 'changed-packages.txt').write_text(''.join(name + '=' + version + '\n' for name, version in sorted(after.items()) if before.get(name) != version))
          PYCODE
          docker run --rm --platform '${{ matrix.platform }}' -v "$PWD/inventory:/out" "$BUILD_IMAGE" sh -ec '
            apk update
            while IFS= read -r spec; do
              apk fetch --output /out/packages "$spec"
              apk fetch --url "$spec" >> /out/package-urls.txt
            done < /out/changed-packages.txt
          '
          docker run --rm --platform '${{ matrix.platform }}' -v "$PWD/inventory:/out" "$BUILD_IMAGE" sh -ec '
            apk add --no-network /out/packages/*.apk
            apk info -vv | sort > /out/verified-packages.txt
          '
          cmp inventory/final-packages.txt inventory/verified-packages.txt
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, urllib.parse
          root = pathlib.Path('inventory')
          urls = {pathlib.PurePosixPath(urllib.parse.urlparse(url.strip()).path).name: url.strip() for url in (root / 'package-urls.txt').read_text().splitlines() if url.startswith('https://')}
          specs = dict(line.split('=', 1) for line in (root / 'changed-packages.txt').read_text().splitlines())
          packages = []
          for name, version in sorted(specs.items()):
              path = root / 'packages' / f'{name}-{version}.apk'
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              packages.append({'name': name, 'version': version, 'url': urls[path.name], 'sha256': digest, 'size': path.stat().st_size})
          assert packages and len(packages) == len(urls)
          (root / 'apk-lock.json').write_text(json.dumps({'schema': 1, 'architecture': '${{ matrix.arch }}', 'image': 'rust:1.97-alpine3.22@sha256:df4efa4e0cdfb5245fa06e3f431387b2bcc96782ce5681b7fb6b0297d745bc29', 'packages': packages}, indent=2) + '\n')
          print(f'Verified {len(packages)} packages and identical offline installation')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prebuilt-inputs-${{ matrix.arch }}
          path: |
            inventory/*.json
            inventory/*.txt
          if-no-files-found: error
  macos:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Record native SDK assumptions
        run: |
          mkdir -p inventory
          { uname -m; sw_vers; xcodebuild -version; xcrun --sdk macosx --show-sdk-version; printf '%s\n' "$ImageOS" "$ImageVersion"; ls -d /Applications/Xcode*.app; } > inventory/macos-sdk.txt
          cat inventory/macos-sdk.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prebuilt-inputs-macos
          path: inventory/*.txt
  windows:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Record native SDK assumptions
        shell: pwsh
        run: |
          New-Item -ItemType Directory inventory
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installations = & $vswhere -format json | ConvertFrom-Json
          $entries = foreach ($installation in $installations) {
            @{ version = $installation.installationVersion; toolsets = @(Get-ChildItem "$($installation.installationPath)/VC/Tools/MSVC" | Select-Object -ExpandProperty Name) }
          }
          @{ imageOS = $env:ImageOS; imageVersion = $env:ImageVersion; visualStudio = @($entries); sdk = @(Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/Lib" | Select-Object -ExpandProperty Name) } | ConvertTo-Json -Depth 5 | Set-Content inventory/windows-sdk.json
          Get-Content inventory/windows-sdk.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prebuilt-inputs-windows
          path: inventory/*.json
