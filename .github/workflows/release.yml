name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.3)'
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  source-ci:
    name: Source CI Evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      reuse: ${{ steps.evidence.outputs.reuse }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}

      - name: Resolve release commit
        id: commit
        run: echo "sha=$(git rev-parse 'HEAD^{commit}')" >> "${GITHUB_OUTPUT}"

      - name: Check successful source CI
        id: evidence
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            core.setOutput('reuse', 'false');
            try {
              const { findReusableCiRun } = await import(`${process.env.GITHUB_WORKSPACE}/rust/scripts/release_ci_evidence.mjs`);
              const run = await findReusableCiRun({
                github,
                repository: `${context.repo.owner}/${context.repo.repo}`,
                sha: process.env.RELEASE_SHA,
              });
              if (run) {
                core.setOutput('reuse', 'true');
                core.notice(`Reusing successful source CI: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id} (attempt ${run.run_attempt})`);
              } else {
                core.notice('No complete matching source CI evidence; running all release source gates.');
              }
            } catch (error) {
              core.setOutput('reuse', 'false');
              core.warning(`Source CI evidence unavailable; running all release source gates: ${error.message}`);
            }

  mesh-resource:
    name: Relayless recovery and resource budgets
    needs: source-ci
    uses: irislib/iris-stack/.github/workflows/product-lab.yml@cec9501659b9cf08f9600e3f14987cad6ca1e7d3
    with:
      lab_rev: cec9501659b9cf08f9600e3f14987cad6ca1e7d3
      htree_rev: ${{ needs.source-ci.outputs.sha }}
      chat_rev: 2270f5778fecf1e2eea7d47a4c382aacad63d551
      drive_rev: 7cb74966ddaecf90fb91b8f36a44ecc4bbda7b02

  gate-static:
    needs: source-ci
    if: needs.source-ci.outputs.reuse != 'true'
    name: Static Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-ci.outputs.sha }}

      - name: Run static release gate
        run: bash scripts/release-gate.sh --lane static

  gate-typescript:
    needs: source-ci
    if: needs.source-ci.outputs.reuse != 'true'
    name: TypeScript Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-ci.outputs.sha }}

      - name: Install FIPS transport system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust for TCP blob interoperability
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Cache Rust interoperability fixture
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-typescript-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-typescript-

      - name: Run TypeScript release gate
        run: bash scripts/release-gate.sh --lane typescript

  gate-rust:
    needs: source-ci
    if: needs.source-ci.outputs.reuse != 'true'
    name: Rust Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-ci.outputs.sha }}

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse3 \
            libdbus-1-dev \
            libfuse3-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-gate-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gate-rust-
            ${{ runner.os }}-cargo-

      - name: Run default-feature Rust release gate
        run: bash scripts/release-gate.sh --lane rust

  gate-rust-peripheral:
    needs: source-ci
    if: needs.source-ci.outputs.reuse != 'true'
    name: Peripheral Rust Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-ci.outputs.sha }}

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install peripheral system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-gate-peripheral-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gate-peripheral-
            ${{ runner.os }}-cargo-

      - name: Run peripheral Rust release gate
        run: bash scripts/release-gate.sh --lane rust-peripheral

  gate-fips:
    needs: source-ci
    if: needs.source-ci.outputs.reuse != 'true'
    name: FIPS WebRTC Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-ci.outputs.sha }}

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install FIPS system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-gate-fips-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gate-fips-
            ${{ runner.os }}-cargo-

      - name: Run isolated FIPS WebRTC release gate
        run: bash scripts/release-gate.sh --lane fips

  pool-migration-systemd:
    needs: source-ci
    if: needs.source-ci.outputs.reuse != 'true'
    name: Pool Migration Systemd Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-ci.outputs.sha }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libfuse3-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-pool-migration-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pool-migration-
            ${{ runner.os }}-cargo-

      - name: Run Pool migration systemd release gate
        run: bash scripts/release-gate.sh --lane pool-migration-systemd

  build:
    name: Build ${{ matrix.target }}
    # Skipped source gates are allowed only with complete CI evidence.
    if: >-
      ${{ always() && !cancelled() && needs['source-ci'].result == 'success' &&
          (needs['source-ci'].outputs.reuse == 'true' ||
           (needs['gate-static'].result == 'success' && needs['gate-typescript'].result == 'success' &&
            needs['gate-rust'].result == 'success' && needs['gate-rust-peripheral'].result == 'success' &&
            needs['gate-fips'].result == 'success' && needs['pool-migration-systemd'].result == 'success')) }}
    needs:
      - source-ci
      - gate-static
      - gate-typescript
      - gate-rust
      - gate-rust-peripheral
      - gate-fips
      - pool-migration-systemd
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            linux_docker: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            linux_docker: true
          - target: x86_64-apple-darwin
            os: macos-14
            linux_docker: false
          - target: aarch64-apple-darwin
            os: macos-14
            linux_docker: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            linux_docker: false
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-ci.outputs.sha }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
            rust/target-release/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build and Package (Unix)
        if: runner.os != 'Windows'
        run: |
          # Linux release builds use Docker-native musl containers so the
          # published binaries are built in a predictable target environment.
          if [ "${{ matrix.linux_docker }}" = "true" ]; then
            bash scripts/build_release_artifacts.sh \
              --version "${RELEASE_TAG}" \
              --targets "${{ matrix.target }}" \
              --output-dir dist/release-artifacts \
              --target-dir target-release \
              --linux-builder docker
          else
            bash scripts/build_release_artifacts.sh \
              --version "${RELEASE_TAG}" \
              --targets "${{ matrix.target }}" \
              --output-dir dist/release-artifacts \
              --target-dir target-release
          fi
          bash scripts/smoke_release_webrtc_unix.sh \
            "dist/release-artifacts/hashtree-${{ matrix.target }}.tar.gz"

      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked --target ${{ matrix.target }} `
            -p git-remote-htree `
            -p hashtree-cashu-cli `
            -p hashtree-cli `
            --features hashtree-cli/fips-webrtc

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release-artifacts/hashtree
          Copy-Item target/${{ matrix.target }}/release/git-remote-htree.exe dist/release-artifacts/hashtree/
          Copy-Item target/${{ matrix.target }}/release/htree-cashu.exe dist/release-artifacts/hashtree/
          Copy-Item target/${{ matrix.target }}/release/htree.exe dist/release-artifacts/hashtree/

          @"
          hashtree - Git over Nostr via Merkle trees
          ==========================================

          Binaries included:
            htree.exe             - CLI and daemon for hashtree operations
            htree-cashu.exe       - Cashu wallet helper for htree cashu
            git-remote-htree.exe  - Git remote helper for htree:// URLs

          Install:
            Copy all three .exe files to a directory in your PATH, e.g.:
            C:\Users\<you>\AppData\Local\Microsoft\WindowsApps\

          Usage:
            htree add <file>                    # add file to hashtree
            htree get <hash>                    # download by hash
            htree start                         # start P2P daemon
            htree cashu balance                 # inspect Cashu wallet
            git clone htree://npub1.../repo     # clone git repo

          More info: https://github.com/mmalmi/hashtree
          "@ | Out-File -FilePath dist/release-artifacts/hashtree/README.txt -Encoding UTF8

          Compress-Archive -Path dist/release-artifacts/hashtree -DestinationPath dist/release-artifacts/hashtree-${{ matrix.target }}.zip
          Remove-Item -Recurse dist/release-artifacts/hashtree

      - name: Smoke packaged WebRTC startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/smoke_release_webrtc_windows.ps1 -ArchivePath "dist/release-artifacts/hashtree-${{ matrix.target }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashtree-${{ matrix.target }}
          path: rust/dist/release-artifacts/*
          retention-days: 7

  release:
    name: Create Release
    if: ${{ !cancelled() && needs.source-ci.result == 'success' && needs.build.result == 'success' && needs.mesh-resource.result == 'success' }}
    needs:
      - source-ci
      - build
      - mesh-resource
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-ci.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release commit
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hashtree-*
          path: artifacts/hashtree
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: find artifacts -maxdepth 2 -type f | sort

      - name: Write release install bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash rust/scripts/write_release_bootstrap_installer.sh \
            --path artifacts/hashtree/install.sh \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}" \
            --asset-base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}"

      - name: Prepare release assets and notes
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=()
          for file in artifacts/hashtree/*; do
            if [ -f "${file}" ] && [[ "${file}" != *.sha256 ]]; then
              files+=("${file}")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          node scripts/render_repo_release_notes.mjs \
            --tag "${{ github.event.inputs.tag || github.ref_name }}" \
            --commit "${{ steps.release_commit.outputs.sha }}" \
            --cli-dir artifacts/hashtree \
            --changelog-file rust/CHANGELOG.md \
            --output-file release-body.md \
            --install-url "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}/install.sh"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: ${{ steps.release_assets.outputs.files }}
          body_path: release-body.md
