name: Verify client downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test bounded downloads and integrity checks
        working-directory: rust
        run: cargo test --locked -p hashtree-client --test downloads
