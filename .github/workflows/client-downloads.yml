name: Verify client downloads

on:
  workflow_dispatch:
    inputs:
      reset_regression:
        type: boolean
        default: false
      source_commit:
        type: string
        default: ""
      source:
        type: boolean
        default: false
      resolver_package:
        type: boolean
        default: false
      ready:
        type: boolean
        default: false
      package:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.source && 35 || 15 }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove request-reset regression against prior implementation
        if: inputs.reset_regression
        working-directory: rust
        run: |
          cp crates/hashtree-client/src/store.rs "$RUNNER_TEMP/fixed-store.rs"
          trap 'cp "$RUNNER_TEMP/fixed-store.rs" crates/hashtree-client/src/store.rs' EXIT
          git show HEAD^:rust/crates/hashtree-client/src/store.rs > crates/hashtree-client/src/store.rs
          if cargo test --locked -p hashtree-client --test downloads request_reset_before_headers > "$RUNNER_TEMP/reset-before.log" 2>&1; then
            cat "$RUNNER_TEMP/reset-before.log"
            echo "Expected old implementation to fail the reset regressions"
            exit 1
          fi
          cat "$RUNNER_TEMP/reset-before.log"
          grep -F 'test result: FAILED. 0 passed; 2 failed;' "$RUNNER_TEMP/reset-before.log"
      - name: Test bounded downloads and integrity checks
        working-directory: rust
        if: ${{ !inputs.package && !inputs.resolver_package && !inputs.source }}
        run: cargo test --locked -p hashtree-client --test downloads
      - name: Test ready-root authentication and latency
        if: inputs.ready
        working-directory: rust
        run: |
          cargo test --locked -p hashtree-client --test transport
          cargo test --locked -p hashtree-resolver --features nostr --lib test_ready_resolve
      - uses: actions/checkout@v4
        if: inputs.source
        with:
          repository: mmalmi/haps
          ref: 57560d8cd0371493855a4d76c3e96213456fe080
          path: source-verifier
          persist-credentials: false
      - name: Verify public source from an empty cache
        if: inputs.source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          python3 source-verifier/scripts/bundle.py --target x86_64-unknown-linux-gnu --destination "$RUNNER_TEMP/source-tools" --cache "$RUNNER_TEMP/source-tools-cache"
          python3 source-verifier/scripts/verify-public-source.py --config haps-release.json --commit "$SOURCE_COMMIT" --helpers "$RUNNER_TEMP/source-tools/libexec" --clone-timeout 1800
      - name: Verify resolver registry package
        if: inputs.resolver_package
        working-directory: rust
        run: |
          cargo package --locked -p hashtree-resolver --no-verify
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/hashtree-resolver/Cargo.toml", "rb"))["package"]["version"])')
          mkdir "$RUNNER_TEMP/resolver-registry-verification"
          tar -xzf "target/package/hashtree-resolver-$version.crate" -C "$RUNNER_TEMP/resolver-registry-verification"
          CARGO_TARGET_DIR="$PWD/target" cargo test --locked --manifest-path "$RUNNER_TEMP/resolver-registry-verification/hashtree-resolver-$version/Cargo.toml" --features nostr --lib test_ready_resolve
          CARGO_TARGET_DIR="$PWD/target" cargo test --locked --manifest-path "$RUNNER_TEMP/resolver-registry-verification/hashtree-resolver-$version/Cargo.toml" --features nostr --lib test_open_resolve
          sha256sum "target/package/hashtree-resolver-$version.crate" > target/package/resolver-package.sha256
          rustc -vV > target/package/resolver-toolchain.txt
          git rev-parse HEAD > target/package/resolver-source.txt
      - uses: actions/upload-artifact@v4
        if: inputs.resolver_package
        with:
          name: resolver-package-${{ github.sha }}
          path: |
            rust/target/package/hashtree-resolver-*.crate
            rust/target/package/resolver-package.sha256
            rust/target/package/resolver-toolchain.txt
            rust/target/package/resolver-source.txt
          retention-days: 7
          if-no-files-found: error
      - name: Verify registry package downloads
        if: inputs.package
        working-directory: rust
        run: |
          cargo package --locked -p hashtree-client --no-verify
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/hashtree-client/Cargo.toml", "rb"))["package"]["version"])')
          mkdir "$RUNNER_TEMP/client-registry-verification"
          tar -xzf "target/package/hashtree-client-$version.crate" -C "$RUNNER_TEMP/client-registry-verification"
          CARGO_TARGET_DIR="$PWD/target" cargo test --locked --manifest-path "$RUNNER_TEMP/client-registry-verification/hashtree-client-$version/Cargo.toml" --test downloads --test transport
          sha256sum "target/package/hashtree-client-$version.crate" > target/package/client-package.sha256
          rustc -vV > target/package/client-toolchain.txt
          git rev-parse HEAD > target/package/client-source.txt
      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: client-package-${{ github.sha }}
          path: |
            rust/target/package/hashtree-client-*.crate
            rust/target/package/client-package.sha256
            rust/target/package/client-toolchain.txt
            rust/target/package/client-source.txt
          retention-days: 7
          if-no-files-found: error
