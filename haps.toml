# https://haps.hashtree.cc
[package]
name = "hashtree"
version = "0.5.2"
target = "host"
description = "Hashtree command-line tools"

[package.commands]
htree = "htree{exe}"
git-remote-htree = "git-remote-htree{exe}"
htree-cashu = "htree-cashu{exe}"

# Reuses the official release inputs, builders and complete mapped payload.
# Native builds require the OS/SDK recorded in rust/release-inputs.json;
# Linux builds require Docker. Haps must be explicitly allowed a host build.
[build]
commands = [["python3", "rust/scripts/build_haps_payload.py", "--target", "{target}"]]
artifacts = { "." = "target/haps-payload" }

[targets.x86_64-pc-windows-msvc.build]
commands = [["python", "rust/scripts/build_haps_payload.py", "--target", "{target}"]]
